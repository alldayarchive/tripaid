        :root { --primary: #2563eb; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f1f5f9; color: #1e293b; user-select: none; }
        .kr { font-family: 'Noto Sans KR', sans-serif; }
        
        /* 앱 프레임 고정 (PC/모바일 공용) */
        .app-frame { 
            position: relative;
            max-width: 500px; 
            margin: 0 auto; 
            background-color: #ffffff; 
            min-height: 100dvh; 
            box-shadow: 0 0 40px rgba(0,0,0,0.1); 
        }

        /* 오버레이 버그 수정 (100dvh 반영) */
        .overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 100%; 
            max-width: 500px; 
            height: 100dvh; 
            background: white; 
            z-index: 3000; 
            overflow-y: auto; 
        }
        .overlay.active { display: block; animation: slideUp 0.25s ease-out; }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        
        #sos-fullscreen { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: #000; 
            color: white; 
            z-index: 5000; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 2rem; 
            text-align: center; 
            max-width: 500px; 
            margin: 0 auto;
        }
        #sos-fullscreen.active { display: flex; }
        
        /* 하단 내비게이션 (고정 위치 수정) */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 100%; 
            max-width: 500px; 
            background: rgba(255, 255, 255, 0.98); 
            border-top: 1px solid rgba(0,0,0,0.05); 
            z-index: 2500; 
            height: 70px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding-bottom: env(safe-area-inset-bottom);
        }

        #toast { 
            visibility: hidden; 
            position: fixed; 
            left: 50%; 
            bottom: 100px; 
            transform: translateX(-50%); 
            background: #1e293b; 
            color: #fff; 
            padding: 12px 24px; 
            border-radius: 50px; 
            font-size: 13px;
            font-weight: 600; 
            z-index: 6000; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        #toast.show { visibility: visible; }
        .btn-tap:active { transform: scale(0.97); transition: 0.1s; }
    </style>
</head>

                setTimeout(() => { window.open(webUrl, '_blank'); }, 500);
            } else {

            }

        const showToast = (m) => {
            const t = document.getElementById("toast");
            t.innerText = m; t.classList.add("show");
            setTimeout(() => { t.classList.remove("show"); }, 2500);
        };

        const setTip = () => {
            document.getElementById('random-tip').innerText = `💡 ${TIPS[Math.floor(Math.random() * TIPS.length)]}`;
        };
        setInterval(setTip, 9000); setTip();

        let wakeLock = null;
        async function activateSOS(en, kr) {
            document.getElementById('sos-en').innerText = en;
            document.getElementById('sos-kr').innerText = kr;
            document.getElementById('sos-fullscreen').classList.add('active');
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
        }

        async function closeSOS() {
            document.getElementById('sos-fullscreen').classList.remove('active');
            if(wakeLock) { await wakeLock.release(); wakeLock = null; }
        }

        function playTTS() {
            const u = new SpeechSynthesisUtterance(document.getElementById('sos-kr').innerText);
            u.lang = 'ko-KR'; u.rate = 0.85; window.speechSynthesis.speak(u);
        }

        function copySOS() {
            const t = `${document.getElementById('sos-kr').innerText}\n(${document.getElementById('sos-en').innerText})`;
            navigator.clipboard.writeText(t).then(() => showToast("✅ Text Copied!"));
        }

        function openHotelModal() { document.getElementById('hotel-modal').classList.remove('hidden'); }
        function closeHotelModal() { document.getElementById('hotel-modal').classList.add('hidden'); }

        function saveHotel() {
            const n = document.getElementById('in-h-name').value;
            const a = document.getElementById('in-h-addr').value;
            const t = document.getElementById('in-h-tel').value;
            if(n && a) {
                try {
                    localStorage.setItem('TRIPAID_STAY_DATA', JSON.stringify({n, a, t}));
                    loadHotel(); closeHotelModal(); showToast("✅ Hotel Saved!");
                } catch(e) { showToast("❌ Save Failed"); }
            }
        }

        function loadHotel() {
            try {
                const s = JSON.parse(localStorage.getItem('TRIPAID_STAY_DATA'));
                if(s) {
                    document.getElementById('h-name').innerText = s.n;
                    document.getElementById('h-addr').innerText = s.a;
                    document.getElementById('hotel-info-card').classList.remove('hidden');
                }
            } catch(e) {}
        }

        function goHome() {
            try {
                const s = JSON.parse(localStorage.getItem('TRIPAID_STAY_DATA'));
                if(!s) return openHotelModal();
                activateSOS(`Take me to my Hotel`, `이 주소로 가주세요:\n${s.a}\n(연락처: ${s.t || '없음'})`);
            } catch(e) { openHotelModal(); }
        }

        function whereAmI() {
            showToast("🛰 Locating you...");
            navigator.geolocation.getCurrentPosition(pos => {
                const url = `https://m.map.naver.com/map.naver?lng=${pos.coords.longitude}&lat=${pos.coords.latitude}&level=12`;
                window.open(url, '_blank');
            }, () => { showToast("❌ GPS Failed. Open Map Search."); setTimeout(()=>openMap("My Location"), 1000); });
        }

        function openCategory(key) {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = CATEGORIES[key].t;
            if(key === 'speak') {
                content.innerHTML = CATEGORIES.speak.i.map(item => `
                    <div onclick="openSpeakSub('${item.s}')" class="p-6 bg-slate-50 rounded-3xl border flex items-center mb-2"><span class="text-3xl mr-4">${item.i}</span><span class="font-bold">${item.n}</span></div>
                `).join('');
            } else {
                content.innerHTML = CATEGORIES[key].i.map(item => `
                    <div onclick="openMap('${item.q}')" class="p-6 bg-slate-50 rounded-3xl border flex justify-between items-center mb-2"><div class="flex items-center"><span class="text-3xl mr-4">${item.i}</span><span class="font-bold text-sm uppercase">${item.n}</span></div><i class="fa-solid fa-chevron-right text-slate-300"></i></div>
                `).join('');
            }
            document.getElementById('overlay').classList.add('active');
        }

        function openSpeakSub(sub) {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = sub.toUpperCase();
            content.innerHTML = SPEAK_DATA[sub].map(item => `
                <div onclick="activateSOS('${item.a[0]}','${item.a[1]}')" class="p-6 bg-slate-50 rounded-3xl border flex justify-between items-center mb-2"><span class="font-bold uppercase text-[13px] text-left pr-4">${item.n}</span><i class="fa-solid fa-comment-dots text-blue-600"></i></div>
            `).join('');
        }

        function openAllTips() {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = "100 Survival Tips";
            content.innerHTML = TIPS.map((t, i) => `<div class="p-5 bg-slate-50 rounded-2xl border-l-4 border-blue-600 mb-3 font-semibold text-sm leading-tight">#${i+1} ${t}</div>`).join('');
            document.getElementById('overlay').classList.add('active');
        }

        function openArticle() {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = "Survival Guide";
            content.innerHTML = `
                <div class="px-2 text-left space-y-5 pb-10">
                    <h3 class="text-2xl font-black italic">The Map Trap & Survival Rules</h3>
                    <p class="text-sm leading-relaxed text-slate-600"><b>1. Navigation:</b> Google Maps walking directions are disabled. Use <b>Naver Map</b>. Taxis use Kakao T.</p>
                    <p class="text-sm leading-relaxed text-slate-600"><b>2. T-Money:</b> Pay for everything: buses, subways, convenience stores, and taxis. Tap your card when entering AND exiting.</p>
                    <p class="text-sm leading-relaxed text-slate-600"><b>3. Safety:</b> Extremely safe 24/7. CCTV is everywhere. If you lose an item, visit the 'Pachulso' (Police Substation).</p>
                    <p class="text-sm leading-relaxed text-slate-600"><b>4. Dining:</b> No tipping. Water and side dishes are free. Use the call bell on the table.</p>
                    <p class="text-sm leading-relaxed text-slate-600"><b>5. Tech:</b> 220V power. Soft water (safe for teeth). Free WiFi is everywhere but use a VPN for security.</p>
                </div>`;
            document.getElementById('overlay').classList.add('active');
        }

        function closeOverlay() { document.getElementById('overlay').classList.remove('active'); }

        document.getElementById('main-sos-btn').addEventListener('click', () => {
            activateSOS("I AM LOST. PLEASE HELP ME.", "길을 잃었습니다. 도와주세요. 여기가 어디인가요?");
        });

        loadHotel();
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
    </script>
</body>
</html>
