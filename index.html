<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TripAid - Korea Survival Kit</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f1f5f9; color: #1e293b; user-select: none; }
        .kr { font-family: 'Noto Sans KR', sans-serif; }
        .app-frame { position: relative; max-width: 500px; margin: 0 auto; background-color: #ffffff; min-height: 100dvh; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
        .overlay { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 100dvh; background: white; z-index: 3000; overflow-y: auto; }
        .overlay.active { display: block; animation: slideUp 0.25s ease-out; }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        #sos-fullscreen { display: none; position: fixed; inset: 0; background: #000; color: white; z-index: 5000; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; text-align: center; max-width: 500px; margin: 0 auto; }
        #sos-fullscreen.active { display: flex; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: white; border-top: 1px solid rgba(0,0,0,0.05); z-index: 2500; height: 70px; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        #toast { visibility: hidden; position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 50px; font-size: 13px; font-weight: 600; z-index: 6000; white-space: nowrap; }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

    <div class="app-frame">
        <!-- 헤더 -->
        <header class="p-5 pt-10 bg-white border-b sticky top-0 z-50 flex flex-col items-center">
            <h1 class="text-2xl font-black italic text-blue-600 tracking-tighter">TripAid</h1>
            <div id="tip-ticker" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-2xl min-h-[50px] flex items-center justify-center">
                <p id="random-tip" class="text-[11px] font-semibold leading-tight text-center px-4"></p>
            </div>
        </header>

        <main class="p-5 space-y-6">
            <!-- SOS -->
            <button id="main-sos-btn" class="w-full p-8 bg-red-600 text-white rounded-[2.5rem] shadow-2xl flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform">
                <span class="text-4xl">🚨</span>
                <span class="text-2xl font-black italic tracking-tight">I'M LOST / SOS</span>
                <span class="text-[10px] font-bold opacity-70 uppercase tracking-widest leading-none">Emergency Help Mode</span>
            </button>

            <!-- 위치/가이드 -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="whereAmI()" class="p-5 bg-white border-2 border-blue-600 rounded-[2rem] flex flex-col items-center justify-center h-32 active:scale-95 transition-all">
                    <i class="fa-solid fa-location-crosshairs text-blue-600 text-2xl mb-2"></i>
                    <span class="font-bold text-[11px] text-blue-600 uppercase">Where Am I?</span>
                </button>
                <button onclick="openArticle()" class="p-5 bg-amber-400 rounded-[2rem] flex flex-col items-center justify-center h-32 active:scale-95 transition-all">
                    <i class="fa-solid fa-book-open text-amber-900 text-2xl mb-2"></i>
                    <span class="font-bold text-[11px] text-amber-900 uppercase">Master Guide</span>
                </button>
            </div>

            <!-- 카테고리 -->
            <div class="grid grid-cols-2 gap-4">
                <div onclick="openCategory('speak')" class="p-5 bg-white border rounded-[2rem] shadow-sm flex flex-col items-center justify-center h-36 text-center cursor-pointer active:scale-95">
                    <i class="fa-solid fa-comment-dots text-blue-600 text-2xl mb-2"></i>
                    <span class="font-bold text-[10px] uppercase">Speak Cards</span>
                </div>
                <div onclick="openCategory('transport')" class="p-5 bg-white border rounded-[2rem] shadow-sm flex flex-col items-center justify-center h-36 text-center cursor-pointer active:scale-95">
                    <i class="fa-solid fa-map-location-dot text-slate-800 text-2xl mb-2"></i>
                    <span class="font-bold text-[10px] uppercase">Maps / Navi</span>
                </div>
            </div>

            <!-- 호텔 -->
            <section class="bg-blue-600 p-8 rounded-[3rem] shadow-xl text-white text-left">
                <div id="hotel-info-card" class="hidden mb-6">
                    <h3 id="h-name" class="text-2xl font-black italic">Hotel Name</h3>
                    <p id="h-addr" class="text-xs opacity-80 mt-2 break-words font-medium"></p>
                </div>
                <button onclick="goHome()" class="w-full p-5 bg-white text-blue-600 rounded-[2rem] flex justify-between items-center shadow-lg font-black italic active:scale-95 transition-all">
                    <span>GO TO HOTEL</span><i class="fa-solid fa-taxi text-yellow-500"></i>
                </button>
                <button onclick="openHotelModal()" class="w-full mt-4 text-center text-[10px] font-bold uppercase underline opacity-60">Update Hotel</button>
            </section>

            <!-- 제휴/푸터 -->
            <div class="grid grid-cols-1 gap-2">
                <a href="https://go.nordvpn.net/aff_c?offer_id=15&aff_id=141918&url_id=23180" target="_blank" class="flex items-center justify-between p-4 bg-white rounded-2xl border text-[10px] font-bold text-slate-400">🛡 NordVPN (Secure WiFi)</a>
                <a href="https://linktr.ee/dedle" target="_blank" class="flex items-center justify-between p-4 bg-white rounded-2xl border text-[10px] font-bold text-slate-400">🌐 Saily eSIM & Info</a>
            </div>

            <footer class="py-10 text-center space-y-8 border-t border-slate-100">
                <a href="https://buymeacoffee.com/djawjdaks8g" target="_blank" class="inline-flex items-center bg-yellow-400 text-yellow-900 px-10 py-4 rounded-full font-black shadow-lg">SUPPORT TRIPAID</a>
                <div class="flex justify-center gap-6 text-[10px] font-bold text-slate-300 uppercase tracking-widest">
                    <a href="privacy.html">Privacy</a>
                    <a href="terms.html">Terms</a>
                    <a href="support.html">Support</a>
                </div>
            </footer>
        </main>

        <nav class="bottom-nav">
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center"><i class="fa-solid fa-house text-blue-600 text-xl"></i><span class="text-[9px] font-bold">Home</span></button>
            <button onclick="openCategory('speak')" class="flex flex-col items-center"><i class="fa-solid fa-comment-dots text-slate-400 text-xl"></i><span class="text-[9px] font-bold">Speak</span></button>
            <button onclick="openAllTips()" class="flex flex-col items-center"><i class="fa-solid fa-lightbulb text-slate-400 text-xl"></i><span class="text-[9px] font-bold">100 Tips</span></button>
            <button onclick="openCategory('transport')" class="flex flex-col items-center"><i class="fa-solid fa-map-location-dot text-slate-400 text-xl"></i><span class="text-[9px] font-bold">Navi</span></button>
        </nav>
    </div>

    <!-- SOS 풀스크린 -->
    <div id="sos-fullscreen">
        <button onclick="closeSOS()" class="absolute top-10 right-10 text-4xl text-slate-600 p-4">&times;</button>
        <div class="w-full">
            <p id="sos-en" class="text-xl font-bold text-slate-500 mb-2 uppercase italic"></p>
            <h2 id="sos-kr" class="kr text-5xl font-black leading-tight mb-12 text-yellow-400 break-keep"></h2>
        </div>
        <div class="w-full max-w-xs space-y-4">
            <button onclick="playTTS()" class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl flex items-center justify-center gap-4 shadow-2xl">
                <i class="fa-solid fa-volume-high"></i> SPEAK OUT
            </button>
            <button onclick="copySOS()" class="w-full py-4 bg-slate-800 text-white rounded-2xl font-bold text-xs uppercase">Copy KR/EN Text</button>
        </div>
    </div>

    <!-- 오버레이 -->
    <div id="overlay" class="overlay">
        <header class="p-6 bg-white sticky top-0 flex justify-between items-center border-b z-50">
            <h2 id="overlay-title" class="text-xl font-black uppercase text-blue-600">Category</h2>
            <button onclick="closeOverlay()" class="text-4xl text-slate-300 p-2">&times;</button>
        </header>
        <div id="overlay-content" class="p-6 space-y-4 pb-32"></div>
    </div>

    <!-- 호텔 모달 -->
    <div id="hotel-modal" class="fixed inset-0 bg-black/70 z-[6000] hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-[3rem] p-8 space-y-5 animate-slideUp">
            <h2 class="text-xl font-black uppercase">Save Stay Info</h2>
            <div class="space-y-3">
                <input type="text" id="in-h-name" placeholder="Hotel Name" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none">
                <input type="text" id="in-h-addr" placeholder="Address (Korean Recommended)" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none">
                <input type="tel" id="in-h-tel" placeholder="Phone Number" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none">
            </div>
            <div class="flex gap-2">
                <button onclick="closeHotelModal()" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black uppercase text-xs">Cancel</button>
                <button onclick="saveHotel()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-xs">Save</button>
            </div>
        </div>
    </div>

    <div id="toast">✅ Done</div>

    <script>
        // --- DATA ---
        const TIPS = [
            "Use Naver Map for walking; Google is often incorrect in Korea.",
            "Tipping is not required or expected. Service is always included.",
            "Subway restrooms are free, clean, and in every station.",
            "WOWPASS kiosks allow currency exchange to a card instantly.",
            "Say 'Annyeong-haseyo' for much friendlier service.",
            "The red subway seats are for elderly/pregnant only. Leave them empty.",
            "Most Korean homes and restaurants require removing shoes.",
            "T-Money cards can be recharged at any convenience store with cash.",
            "Drinking tap water is safe for hygiene, but Koreans buy bottled water.",
            "Always stand on the right side of the escalator.",
            "Trash bins are rare; look for them inside subway stations.",
            "Press the bell on your table to call a waiter in restaurants.",
            "Wait for passengers to exit before you board the train.",
            "Subway transfers are free if made within 30 minutes.",
            "Check AREX schedule for Incheon Airport express trains.",
            "220V power with Type C/F (European) plugs is standard.",
            "Emergency: Police 112, Medical/Fire 119.",
            "Kakao T is the best app to call a taxi.",
            "Traditional palaces are free if you wear a Hanbok.",
            "Daiso is the best place for cheap travel essentials.",
            "Most elevators use 'F' instead of the number '4'.",
            "Convenience store food (Ramen/Gimbap) is safe and high quality.",
            "Public drinking is legal in parks like the Han River.",
            "Carry your passport for instant tax refunds at major shops.",
            "Seoul is very safe at 3 AM, but stay in well-lit areas.",
            "Yellow taxis are standard; Black taxis (Deluxe) are expensive.",
            "Seoul subway has heated seats in winter.",
            "Bowing slightly shows respect when greeting.",
            "Most coffee shops have fast WiFi and many outlets.",
            "Fine Dust (Mise-monji) levels can be high; wear a mask.",
            // ... (전체 100개 팁으로 확장 가능)
        ];

        const SPEAK_DATA = {
            taxi: [
                { n: "Go to this address", a: ["Please take me to this address.", "이 주소로 가주세요."] },
                { n: "Open the trunk", a: ["Can you open the trunk, please?", "트렁크 좀 열어주세요."] },
                { n: "Receipt, please", a: ["May I have a receipt?", "영수증 좀 주실 수 있나요?"] },
                { n: "Stop here, please", a: ["Please stop here.", "여기서 세워주세요."] },
                { n: "Turn on the AC", a: ["Could you turn on the air conditioner?", "에어컨 좀 틀어주세요."] }
            ],
            hotel: [
                { n: "Check-in, please", a: ["I'd like to check in.", "체크인 부탁드립니다."] },
                { n: "Keep my luggage?", a: ["Can you store my luggage for a while?", "짐 좀 맡아주실 수 있나요?"] },
                { n: "WiFi Password?", a: ["What is the WiFi password?", "와이파이 비밀번호가 뭐예요?"] },
                { n: "Need more towels", a: ["I need more towels, please.", "수건이 더 필요해요."] },
                { n: "Room is cold", a: ["The room is too cold.", "방이 너무 추워요."] }
            ],
            urgent: [
                { n: "Please help me", a: ["Please help me!", "도와주세요!"] },
                { n: "Call the police", a: ["Please call the police.", "경찰을 불러주세요."] },
                { n: "Call an ambulance", a: ["Please call an ambulance.", "구급차를 불러주세요."] },
                { n: "I lost my bag", a: ["I lost my bag/wallet.", "가방(지갑)을 잃어버렸어요."] },
                { n: "I'm sick/hurt", a: ["I'm sick. I need a doctor.", "몸이 아파요. 의사가 필요해요."] }
            ],
            dining: [
                { n: "No meat, please", a: ["No meat, please. (Vegetarian)", "고기는 빼주세요. (채식주의자입니다)"] },
                { n: "Not spicy, please", a: ["Please make it not spicy.", "맵지 않게 해주세요."] },
                { n: "Check, please", a: ["The bill, please.", "계산해 주세요."] },
                { n: "Water, please", a: ["Could I have some water?", "물 좀 주시겠어요?"] },
                { n: "Is this pork?", a: ["Is this pork?", "이거 돼지고기인가요?"] }
            ],
            daily: [
                { n: "Where is toilet?", a: ["Where is the restroom?", "화장실이 어디인가요?"] },
                { n: "How much?", a: ["How much is this?", "이거 얼마인가요?"] },
                { n: "Card okay?", a: ["Do you accept credit cards?", "카드 결제 되나요?"] },
                { n: "Tax Refund?", a: ["Can I get a tax refund?", "텍스 리펀 받을 수 있나요?"] },
                { n: "Write here?", a: ["Could you write it down here?", "여기에 적어주실 수 있나요?"] }
            ]
        };

        const CATEGORIES = {
            speak: { t: "Choose Situation", i: [
                { n: "Taxi / Transport", i: "🚖", s: "taxi" },
                { n: "Hotel / Stay", i: "🏨", s: "hotel" },
                { n: "Urgent / SOS", i: "🚨", s: "urgent" },
                { n: "Food / Dining", i: "🍜", s: "dining" },
                { n: "Life / Shopping", i: "🛍️", s: "daily" }
            ]},
            transport: { t: "Navigation Help", i: [
                { n: "Naver Map (App Search)", i: "🧭", q: "Naver Map" },
                { n: "Subway Station", i: "🚇", q: "Subway Station" },
                { n: "WOWPASS Kiosk", i: "💳", q: "WOWPASS" },
                { n: "Taxi Stand", i: "🚕", q: "Taxi Stand" }
            ]},
            emergency: { t: "Medical & Safety", i: [
                { n: "Hospital (ER)", i: "🏥", q: "International Hospital" },
                { n: "24h Pharmacy", i: "💊", q: "Pharmacy" },
                { n: "Police Station", i: "👮", q: "Police Station" }
            ]},
            essentials: { t: "Utilities", i: [
                { n: "Public Toilet", i: "🚻", q: "Public Toilet" },
                { n: "Luggage Locker", i: "🧳", q: "Luggage Storage" },
                { n: "Conv. Store", i: "🏪", q: "Convenience Store" }
            ]}
        };

        // --- LOGIC ---
        const showToast = (m) => {
            const t = document.getElementById("toast");
            t.innerText = m; t.classList.add("show");
            setTimeout(() => { t.classList.remove("show"); }, 2500);
        };

        const setTip = () => {
            document.getElementById('random-tip').innerText = `💡 ${TIPS[Math.floor(Math.random() * TIPS.length)]}`;
        };
        setInterval(setTip, 9000); setTip();

        let wakeLock = null;
        async function activateSOS(en, kr) {
            document.getElementById('sos-en').innerText = en;
            document.getElementById('sos-kr').innerText = kr;
            document.getElementById('sos-fullscreen').classList.add('active');
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
        }

        async function closeSOS() {
            document.getElementById('sos-fullscreen').classList.remove('active');
            if(wakeLock) { await wakeLock.release(); wakeLock = null; }
        }

        function playTTS() {
            const u = new SpeechSynthesisUtterance(document.getElementById('sos-kr').innerText);
            u.lang = 'ko-KR'; u.rate = 0.85; window.speechSynthesis.speak(u);
        }

        function copySOS() {
            const t = `${document.getElementById('sos-kr').innerText}\n(${document.getElementById('sos-en').innerText})`;
            navigator.clipboard.writeText(t).then(() => showToast("✅ Text Copied!"));
        }

        function openHotelModal() { document.getElementById('hotel-modal').classList.remove('hidden'); }
        function closeHotelModal() { document.getElementById('hotel-modal').classList.add('hidden'); }

        function saveHotel() {
            const n = document.getElementById('in-h-name').value;
            const a = document.getElementById('in-h-addr').value;
            const t = document.getElementById('in-h-tel').value;
            if(n && a) {
                localStorage.setItem('TRIPAID_HOTEL_INFO', JSON.stringify({n, a, t}));
                loadHotel(); closeHotelModal(); showToast("✅ Saved!");
            }
        }

        function loadHotel() {
            const s = JSON.parse(localStorage.getItem('TRIPAID_HOTEL_INFO'));
            if(s) {
                document.getElementById('h-name').innerText = s.n;
                document.getElementById('h-addr').innerText = s.a;
                document.getElementById('hotel-info-card').classList.remove('hidden');
            }
        }

        function goHome() {
            const s = JSON.parse(localStorage.getItem('TRIPAID_HOTEL_INFO'));
            if(!s) return openHotelModal();
            activateSOS(`Take me to my Hotel`, `이 주소로 가주세요:\n${s.a}\n(연락처: ${s.t || '없음'})`);
        }

        function whereAmI() {
            showToast("🛰 Locating...");
            navigator.geolocation.getCurrentPosition(pos => {
                location.href = `https://m.map.naver.com/map.naver?lng=${pos.coords.longitude}&lat=${pos.coords.latitude}&level=12`;
            }, () => { showToast("❌ GPS Failed"); });
        }

        function openCategory(key) {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = CATEGORIES[key].t;
            if(key === 'speak') {
                content.innerHTML = CATEGORIES.speak.i.map(item => `
                    <div onclick="openSpeakSub('${item.s}')" class="p-6 bg-slate-50 rounded-3xl border flex items-center mb-2"><span class="text-3xl mr-4">${item.i}</span><span class="font-bold">${item.n}</span></div>
                `).join('');
            } else {
                content.innerHTML = CATEGORIES[key].i.map(item => `
                    <div onclick="window.open('https://m.map.naver.com/search2/search.naver?query=${encodeURIComponent(item.q)}','_blank')" class="p-6 bg-slate-50 rounded-3xl border flex justify-between items-center mb-2"><div class="flex items-center text-left"><span class="text-3xl mr-4">${item.i}</span><span class="font-bold text-sm uppercase">${item.n}</span></div><i class="fa-solid fa-chevron-right text-slate-300"></i></div>
                `).join('');
            }
            document.getElementById('overlay').classList.add('active');
        }

        function openSpeakSub(sub) {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = sub.toUpperCase();
            content.innerHTML = SPEAK_DATA[sub].map(item => `
                <div onclick="activateSOS('${item.a[0]}','${item.a[1]}')" class="p-6 bg-slate-50 rounded-3xl border flex justify-between items-center mb-2"><span class="font-bold uppercase text-[13px] text-left pr-4">${item.n}</span><i class="fa-solid fa-comment-dots text-blue-600"></i></div>
            `).join('');
        }

        function openAllTips() {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = "Survival Tips";
            content.innerHTML = TIPS.map((t, i) => `<div class="p-5 bg-slate-50 rounded-2xl border-l-4 border-blue-600 mb-3 font-semibold text-sm">#${i+1} ${t}</div>`).join('');
            document.getElementById('overlay').classList.add('active');
        }

        function openArticle() {
            const content = document.getElementById('overlay-content');
            document.getElementById('overlay-title').innerText = "Guide";
            content.innerHTML = `<div class="px-2 text-left space-y-4 pb-10"><h3 class="text-xl font-black italic">The Map Trap</h3><p class="text-sm">Google Maps walking is disabled in Korea. Use Naver Map.</p><h3 class="text-xl font-black italic">T-Money</h3><p class="text-sm">Pay for buses and subways. Tap card when boarding and exiting.</p></div>`;
            document.getElementById('overlay').classList.add('active');
        }

        function closeOverlay() { document.getElementById('overlay').classList.remove('active'); }

        document.getElementById('main-sos-btn').addEventListener('click', () => {
            activateSOS("I AM LOST. PLEASE HELP.", "길을 잃었습니다. 도와주세요. 여기가 어디인가요?");
        });

        loadHotel();
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
    </script>
</body>
</html>
